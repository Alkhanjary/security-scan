<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}security-scan{% endblock %}</title>
<meta name="description" content="A lightweight, offline-first security scanner for code, web and network — with an optional AI layer that verifies findings and explains what matters.">
<meta property="og:type" content="website">
<meta property="og:title" content="{% block og_title %}security-scan{% endblock %}">
<meta property="og:description" content="A lightweight, offline-first security scanner for code, web and network — with an optional AI layer that verifies findings and explains what matters.">
<meta name="theme-color" content="#e8ecea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171f1d" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<script>
  (function () {
    var saved = localStorage.getItem('ss-theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  })();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="{{ url_for('landing') }}">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2.5l7.5 3v5.6c0 5-3.2 8.9-7.5 10.4-4.3-1.5-7.5-5.4-7.5-10.4V5.5l7.5-3z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M8.7 12.2l2.2 2.2 4.4-4.6" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>security-scan</span>
    </a>
    <nav class="site-nav">
      <a href="{{ url_for('landing') }}#features">Features</a>
      <a href="{{ url_for('landing') }}#quickstart">Quick start</a>
      <a class="nav-cta" href="{{ url_for('dashboard') }}">Open Scanner</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>security-scan — offline-first code / web / network scanner.</span>
    <span class="footer-note">Only scan code, sites, and hosts you own or are explicitly authorized to test.</span>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
